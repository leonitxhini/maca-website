kind = "web"
previewPath = "/"
title = "Maça — Matcha Coffee"
version = "1.0.0"
id = "artifacts/maca-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19587

[services.development]
run = "pnpm --filter @workspace/maca-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maca-website", "run", "build" ]
publicDir = "artifacts/maca-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19587"
BASE_PATH = "/"
